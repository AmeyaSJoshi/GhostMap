# RESEARCH SPIKE — NOT PRODUCTION. Standalone E1 capture app; never linked into GhostMap.
# Generate the Xcode project with:  xcodegen generate   (output is gitignored)
name: GhostE1Recorder
options:
  bundleIdPrefix: com.ghostmap.research
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: 553SS7SNPX
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  GhostE1Recorder:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ghostmap.research.e1recorder
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: GhostMap E1
        NSCameraUsageDescription: Records camera frames and AR poses for the GhostMap E1 room-footprint experiment. Data stays on this device until you copy it off.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIRequiredDeviceCapabilities: [arkit]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
