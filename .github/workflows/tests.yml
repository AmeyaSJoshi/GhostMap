# Runs every automated check on each push and pull request.
#
#   tools  - Python checks that need no Unity (always runs).
#   unity  - the three EditMode suites (shared, viewer, scanner) in GameCI's
#            Unity 6000.3.24f1 Linux image. Needs three repository secrets,
#            set once by the owner; see docs/ci.md.
#
# Expected counts after task R1 (GhostMapDublinHacks at 0b7a106):
#   shared 202 · viewer 548 · scanner 577

name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tools:
    name: Python tools and fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Valid fixtures pass, the malformed one fails
        run: |
          python3 tools/inspect_snapshot.py --quiet fixtures/valid-room-v1.json
          python3 tools/inspect_snapshot.py --quiet fixtures/room-with-door-window-v1.json
          if python3 tools/inspect_snapshot.py --quiet fixtures/malformed-room-v1.json; then
            echo "malformed-room-v1.json should be rejected" >&2
            exit 1
          fi

      - name: Fixture sender builds protocol v1 messages
        run: python3 tools/send_fixture.py --dry-run

      - name: Test runner script parses
        run: bash -n tools/run_unity_tests.sh

  unity:
    name: Unity EditMode (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: shared
            projectPath: shared/TestProject
          - suite: viewer
            projectPath: apps/viewer
          - suite: scanner
            projectPath: apps/scanner
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - name: Check the Unity licence secrets exist
        run: |
          if [ -z "$UNITY_LICENSE" ] || [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
            echo "::error::Unity licence secrets are missing. Add UNITY_LICENSE, UNITY_EMAIL and UNITY_PASSWORD as repository secrets; see docs/ci.md."
            exit 1
          fi

      - uses: actions/checkout@v4

      # Importing a Unity project from scratch takes minutes; cache Library per project.
      - uses: actions/cache@v4
        with:
          path: ${{ matrix.projectPath }}/Library
          key: Library-${{ matrix.suite }}-${{ hashFiles(format('{0}/Packages/packages-lock.json', matrix.projectPath), 'shared/com.ghostmap.shared/**') }}
          restore-keys: |
            Library-${{ matrix.suite }}-

      # Pinned: a third-party report says v4.4.0 broke Personal-licence
      # activation and v4.3.2 works. Re-check before moving the pin.
      - uses: game-ci/unity-test-runner@v4.3.2
        id: tests
        with:
          projectPath: ${{ matrix.projectPath }}
          unityVersion: 6000.3.24f1
          testMode: editmode
          artifactsPath: test-results/${{ matrix.suite }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: EditMode results (${{ matrix.suite }})

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.suite }}
          path: ${{ steps.tests.outputs.artifactsPath }}
          if-no-files-found: ignore
