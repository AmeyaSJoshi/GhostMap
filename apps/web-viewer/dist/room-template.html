<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src data: blob:">
<title>GhostMap room</title>
<style>
:root {
  --bg: #f4f5f7;
  --canvas: #e6e8ec;
  --surface: #ffffff;
  --text: #1b1f24;
  --muted: #5d6570;
  --line: #d8dce2;
  --accent: #0a84ff;
  --accent-text: #ffffff;
  --warn-bg: #fff5d6;
  --warn-text: #6b4e00;
  --radius: 10px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121418;
    --canvas: #1c1f25;
    --surface: #1a1d22;
    --text: #e8eaed;
    --muted: #9aa2ad;
    --line: #2d323a;
    --accent: #3d9bff;
    --accent-text: #0b0d10;
    --warn-bg: #3a2f10;
    --warn-text: #f3d987;
  }
}

* { box-sizing: border-box; }

/* Components set their own display, which would otherwise beat the hidden attribute. */
[hidden] { display: none !important; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font: 14px/1.45 var(--font);
}

body { display: flex; flex-direction: column; }

h1, h2 { margin: 0; font-weight: 600; }
h1 { font-size: 16px; }
h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }

button {
  font: inherit;
  color: var(--text);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 6px 12px;
  cursor: pointer;
}
button:hover:not(:disabled) { border-color: var(--accent); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button:disabled { opacity: 0.45; cursor: not-allowed; }
button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }

.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  padding: 10px 16px;
  border-bottom: 1px solid var(--line);
  background: var(--surface);
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand h1 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mark { width: 14px; height: 14px; border-radius: 4px; background: var(--accent); flex: none; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }

.layout { flex: 1; display: flex; min-height: 0; }

.viewport { position: relative; flex: 1; min-width: 0; background: var(--canvas); overflow: hidden; }
.viewport canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.viewport.measuring canvas { cursor: crosshair; }

.status {
  position: absolute;
  left: 50%;
  top: 12px;
  transform: translateX(-50%);
  margin: 0;
  max-width: calc(100% - 32px);
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--surface);
  border: 1px solid var(--line);
  box-shadow: 0 2px 8px rgb(0 0 0 / 0.12);
  font-size: 13px;
  pointer-events: none;
  text-align: center;
}

.measure-label {
  margin: 0;
  position: absolute;
  transform: translate(-50%, -120%);
  padding: 6px 10px;
  border-radius: 8px;
  background: var(--accent);
  color: var(--accent-text);
  font-size: 13px;
  pointer-events: none;
  white-space: nowrap;
}
.measure-label div { display: flex; gap: 8px; justify-content: space-between; }
.measure-label dt, .measure-label dd { margin: 0; }
.measure-label dt { opacity: 0.8; }
.measure-label dd { font-variant-numeric: tabular-nums; font-weight: 600; }

.side {
  width: 300px;
  flex: none;
  overflow-y: auto;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  border-left: 1px solid var(--line);
}

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.card-head { display: flex; align-items: center; justify-content: space-between; }
.selection { border-color: var(--accent); }
.selection h2 { color: var(--text); text-transform: none; letter-spacing: 0; font-size: 15px; }
.icon { padding: 0 8px; line-height: 24px; font-size: 18px; }
.selection-photo {
  display: block;
  width: 100%;
  max-height: 220px;
  object-fit: contain;
  border-radius: calc(var(--radius) - 4px);
  background: var(--canvas);
}

.rows { margin: 0; display: grid; gap: 4px; }
.rows div { display: flex; justify-content: space-between; gap: 12px; }
.rows dt { color: var(--muted); }
.rows dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }

.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.list-item { width: 100%; text-align: left; border-color: transparent; background: transparent; }
.list-item:hover { background: var(--bg); }
.list-item.missing { color: var(--muted); font-style: italic; }
.muted { color: var(--muted); }

.warnings { margin: 0; padding: 8px 8px 8px 24px; border-radius: 8px; background: var(--warn-bg); color: var(--warn-text); font-size: 13px; }

.hint { margin: 0; color: var(--muted); font-size: 12px; }

.message {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  padding: 24px;
  background: var(--bg);
}
.message p { max-width: 32rem; margin: 0; font-size: 17px; text-align: center; }
body.failed .toolbar, body.failed .layout { display: none; }

@media (max-width: 720px) {
  .layout { flex-direction: column; }
  .viewport { min-height: 60vh; }
  .side { width: auto; border-left: 0; border-top: 1px solid var(--line); padding: 12px 16px; }
}
</style>
</head>
<body>
<header class="toolbar">
  <div class="brand"><span class="mark" aria-hidden="true"></span><h1 id="room-title">GhostMap</h1></div>
  <div class="actions" role="toolbar" aria-label="View tools">
    <button type="button" id="frame" title="Frame the whole room (F)">Frame room</button>
    <button type="button" id="dollhouse" aria-pressed="false" title="Hide the ceiling to look in from above (D)">Dollhouse</button>
    <button type="button" id="measure" aria-pressed="false" title="Click two points to measure (M)">Measure</button>
  </div>
</header>

<main class="layout">
  <div id="viewport" class="viewport">
    <p id="status" class="status" role="status" hidden></p>
    <dl id="measure-label" class="measure-label" hidden></dl>
  </div>

  <aside class="side">
    <section class="card">
      <h2>Room</h2>
      <dl id="room-details" class="rows"></dl>
      <ul id="warnings" class="warnings" hidden></ul>
    </section>

    <section id="selection" class="card selection" hidden>
      <div class="card-head">
        <h2 id="selection-title">Object</h2>
        <button type="button" id="selection-close" class="icon" aria-label="Close details">×</button>
      </div>
      <img id="selection-photo" class="selection-photo" alt="" hidden>
      <dl id="selection-details" class="rows"></dl>
    </section>

    <section class="card">
      <h2>Furniture</h2>
      <ul id="object-list" class="list"></ul>
    </section>

    <p class="hint">Drag to orbit · right-drag or two fingers to pan · scroll to zoom</p>
  </aside>
</main>

<div id="message" class="message" hidden><p></p></div>
